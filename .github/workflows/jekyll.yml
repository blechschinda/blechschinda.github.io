# This workflow builds and deploys a Jekyll site to GitHub Pages.
name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Permissions required for GitHub Pages deployment and runner detection.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Check whether the Raspberry Pi runner is online and available.
  select-runner:
    name: Select build runner
    runs-on: ubuntu-latest

    outputs:
      runner: ${{ steps.select.outputs.runner }}

    steps:
      - name: Check Raspberry Pi runner
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          available_runners=$(
            gh api \
              "repos/${{ github.repository }}/actions/runners" \
              --jq '
                [
                  .runners[]
                  | select(.status == "online")
                  | select(.busy == false)
                  | select(.labels | map(.name) | index("ARM64"))
                ]
                | length
              '
          )

          if [ "$available_runners" -gt 0 ]; then
            echo 'runner=["self-hosted","Linux","ARM64"]' >> "$GITHUB_OUTPUT"
            echo "The Raspberry Pi runner is online and available."
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "The Raspberry Pi runner is unavailable."
            echo "Falling back to ubuntu-latest."
          fi

  # Build the Jekyll site using the Raspberry Pi when available.
  build:
    name: Build Jekyll site
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: "3.1"
          bundler-cache: true
          cache-version: 0

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  # Deploy the generated site using a GitHub-hosted runner.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
